services:
  mysql:
    image: mysql:8.0
    container_name: lv-cube-mysql
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: lv_cube
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - lv-cube-mysql-data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lv-cube-redis
    ports:
      - "6379:6379"
    volumes:
      - lv-cube-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  lv-cube-mysql-data:
  lv-cube-redis-data:
